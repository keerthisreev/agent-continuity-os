services:
  dashboard:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    command: ["python3", "dashboard/app.py", "--host", "0.0.0.0",
              "--port", "5000", "--scenario", "gray", "--step-delay", "0.8"]
    restart: "no"

  pipeline:
    build: .
    env_file:
      - .env
    # The terminal demo: timestamped timeline + the $20K screen.
    command: ["python3", "demo.py", "--failure", "gray"]
    depends_on:
      - dashboard
    restart: "no"
